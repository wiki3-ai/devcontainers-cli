[package]
name = "devcontainer-core"
version = "0.1.0"
description = "Reusable dev-container lifecycle and runtime engine. Used by the Devcontainers.app Tauri 2 binary and by sibling apps (e.g. Wiki3) that embed the same engine."
authors = ["Wiki3 AI"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "devcontainer_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time", "fs"] }
async-trait = "0.1"
tracing = "0.1"
parking_lot = "0.12"
once_cell = "1"
url = "2"
percent-encoding = "2"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
