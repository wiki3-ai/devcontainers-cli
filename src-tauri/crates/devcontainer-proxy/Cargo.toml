[package]
name = "devcontainer-proxy"
version = "0.1.0"
description = "Forward proxy for dev containers. Phase 1: CONNECT-only passthrough with per-host bandwidth stats. Future phases will add a per-protocol caching layer (pip, npm, GitHub releases) without TLS interception."
authors = ["Wiki3 AI"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "devcontainer_proxy"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time"] }
tracing = "0.1"
parking_lot = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time", "test-util"] }
