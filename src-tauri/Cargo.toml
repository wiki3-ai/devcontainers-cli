[package]
name = "devcontainers-app"
version = "0.1.0"
description = "Devcontainers.app — Tauri 2 desktop app for managing dev containers (Apple Containers; Podman/Docker later)."
authors = ["Wiki3 AI"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "devcontainers_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util", "time", "fs"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
once_cell = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
url = "2"
percent-encoding = "2"

[features]
default = []
# When set, integration tests in `tests/` may drive the real `container` CLI.
apple-containers-live = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
