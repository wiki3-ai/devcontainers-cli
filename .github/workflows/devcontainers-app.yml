name: devcontainers-app

on:
  push:
    # `docker-runtime` is the active development branch for the fork's Rust
    # crate. With only `main` listed, every commit on it went untested and
    # accumulated clippy findings that nobody saw.
    branches: [main, docker-runtime]
  pull_request:
    branches: [main, docker-runtime]

jobs:
  rust:
    name: cargo check / clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Tauri 2 system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The crate is the part that has to work on Windows: it decides whether
  # `docker.exe` / `podman.exe` exist and drives them. Nothing here was ever
  # run on Windows until this job, which is the only way to know — a
  # cross-compiled `cargo check` on a Mac proves it compiles, not that it runs.
  #
  # Scoped to the crate rather than the workspace: the Tauri host app is a
  # separate question and needs its own WebView2/system-dep story.
  rust-windows:
    name: cargo test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
      - run: cargo check -p devcontainer-core --all-targets
      - run: cargo clippy -p devcontainer-core --all-targets -- -D warnings
      - run: cargo test -p devcontainer-core

  deno:
    name: deno check / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check
      - run: deno task build
      - run: deno task build:check-no-node-builtins

  spec-typecheck:
    name: spec slice tsc --noEmit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx tsc -p spec/tsconfig.json --noEmit
